[package]
name = "yeti-sdk-go"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Go binding for the Yeti SDK — a cgo-facing C-ABI staticlib over the shared yeti-sdk logic (ADR-025, YTC-519)."
repository = "https://github.com/YetiRocks/yeti"
publish = false

# cgo links a static archive and the generated C header. `staticlib` produces
# the archive; `lib` lets the in-crate header-gen binary link the crate.
[lib]
name = "yeti_sdk_go"
crate-type = ["staticlib", "lib"]

[[bin]]
# Emits the C header (yeti_sdk_go.h) from the #[no_mangle] surface via cbindgen.
name = "yeti-sdk-go-header"
path = "src/bin/header.rs"

[dependencies]
# The shared client logic — this crate only adapts it to a C ABI for cgo,
# exactly as yeti-sdk-node adapts it to napi. One source, no drift.
# `remote` is the host-RPC wire client this binding wraps (YTC-733: it is
# off-by-default on yeti-sdk so a customer wasm app doesn't ship it; a language
# binding dials a node and so enables it explicitly).
yeti-sdk = { path = "../../crates/sdk/yeti-sdk", features = ["remote"] }
# The async core needs a runtime; the C ABI is blocking, so each call drives
# the future to completion on this runtime.
tokio = { version = "1.52", features = ["net", "rt", "rt-multi-thread", "time", "sync"] }
# Used only by the `yeti-sdk-go-header` bin to emit the C header from the
# #[no_mangle] surface. The staticlib does not reference it.
cbindgen = "0.27"

[profile.release]
lto = true

# Detached from the root workspace — a binding pins its own versions.
[workspace]
